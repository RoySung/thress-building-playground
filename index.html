<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Three.js 3D City Street Scene Playground - Low-Poly City Street Scene using free 3D models from threejsassets.com" />
  <title>Three.js 3D City Street Scene Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loader-container">
      <div class="loader-ring"></div>
      <div class="loader-text">
        <h2>Loading 3D Street Scene…</h2>
        <p id="loading-status">Initializing scene</p>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="loading-percent">0%</span>
      </div>
    </div>
  </div>

  <!-- UI overlay -->
  <div id="ui-overlay">
    <div class="top-bar">
      <div class="logo">
        <span class="logo-icon">🏙️</span>
        <span class="logo-text">Three.js City Playground</span>
      </div>
      <div class="lighting-selector" id="lighting-selector">
        <button class="lighting-btn active" data-preset="day" title="Day Mode">
          <span class="preset-icon">☀️</span>
          <span class="preset-label">Day</span>
        </button>
        <button class="lighting-btn" data-preset="rainy" title="Rainy Mode">
          <span class="preset-icon">🌧️</span>
          <span class="preset-label">Rainy</span>
        </button>
        <button class="lighting-btn" data-preset="sunset" title="Sunset Mode">
          <span class="preset-icon">🌅</span>
          <span class="preset-label">Sunset</span>
        </button>
        <button class="lighting-btn" data-preset="night" title="Night Mode">
          <span class="preset-icon">🌙</span>
          <span class="preset-label">Night</span>
        </button>
      </div>

      <div class="controls">
        <button id="btn-reset" class="ctrl-btn" title="Reset Camera">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
        <button id="btn-toggle-rotate" class="ctrl-btn active" title="Toggle Auto Cruise">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="14" y="4" width="4" height="16" rx="1"/>
            <rect x="6" y="4" width="4" height="16" rx="1"/>
          </svg>
        </button>
        <div id="camera-mode-wrapper" class="camera-mode-wrapper">
          <select id="camera-mode-select" class="camera-mode-select" title="Select Camera Cruise Mode">
            <option value="cinematic">🎬 Cinematic</option>
            <option value="panorama">🏙️ Panorama</option>
            <option value="street">🏎️ Street Level</option>
            <option value="poi">🎯 POI Cruise</option>
            <option value="auto_sequence">🔄 Auto Sequence</option>
          </select>
        </div>
        <button id="btn-info" class="ctrl-btn" title="Model Credits & Licenses">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Camera Mode Toast Notification -->
    <div id="camera-toast" class="camera-toast hidden">
      <span id="camera-toast-text">🎬 Camera Mode: Cinematic</span>
    </div>

    <!-- Info panel -->
    <div id="info-panel" class="info-panel hidden">
      <div class="info-header">
        <h3>Model Credits & Licenses</h3>
        <button id="btn-close-info" class="close-btn">✕</button>
      </div>
      <div class="info-content">
        <p class="info-license">All 3D models are sourced from <a href="https://threejsassets.com/assets/free" target="_blank" rel="noopener">threejsassets.com</a> free tier. Free for commercial use, no attribution required.</p>
        <div id="model-list" class="model-list"></div>
      </div>
    </div>

    <div class="bottom-hint">
      <span>🖱️ Drag to rotate · Scroll to zoom · Right-click to pan</span>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
